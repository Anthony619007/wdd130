<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>


<<body>
    <Main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form action="#" method="post">

            <div class="question">
                <div class="question-text">1. What does the acronym CSS stand for?</div>
                <div class="input-wrapper">
                    <input type="text" name="q1" placeholder="Your answer">
                </div>
            </div>


            <div class="question">
                <div class="question-text">2. How are id and class attributes selected in CSS?</div>
                <div class="input-wrapper">
                    <input type="text" name="q2" placeholder="Your answer">
                </div>
            </div>


            <div class="question">
                <div class="question-text">3. Which of the following is a valid CSS comment?</div>
                <div class="input-wrapper">
                    <select name="q3">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="// comment">// This is a comment</option>
                        <option value="/* comment */">/* This is a comment */</option>
                        <option value="<!-- comment -->">&lt;!-- This is a comment --&gt;</option>
                        <option value="# comment"># This is a comment</option>
                    </select>
                </div>
            </div>


            <div class="question">
                <div class="question-text">4. What is the bottom margin given this declaration?
                </div>
                <div class="code-block">margin: 10px 5px 15px;</div>
                <div class="input-wrapper">
                    <input type="text" name="q4" placeholder="Your answer">
                </div>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </Main>
    </body>

</html>
